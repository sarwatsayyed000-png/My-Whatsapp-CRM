name: Import WACRM source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !hashFiles('.wacrm-import-complete') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Import WACRM
        run: |
          set -e
          git clone --depth 1 https://github.com/ArnasDon/wacrm.git /tmp/wacrm
          rm -rf /tmp/wacrm/.git
          cp -a /tmp/wacrm/. .
          touch .wacrm-import-complete

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import WACRM source code" || exit 0
          git push
