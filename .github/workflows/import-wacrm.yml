name: Import WACRM source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Import WACRM
        shell: bash
        run: |
          set -e
          if [ -f .wacrm-import-complete ]; then
            echo "WACRM source is already imported."
            exit 0
          fi

          git clone --depth 1 https://github.com/ArnasDon/wacrm.git /tmp/wacrm
          rm -rf /tmp/wacrm/.git
          cp -a /tmp/wacrm/. .
          touch .wacrm-import-complete

      - name: Commit imported source
        shell: bash
        run: |
          set -e
          if [ ! -f .wacrm-import-complete ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import WACRM source code"
          git push
